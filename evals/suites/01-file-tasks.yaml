# Straight file work.  These are the cases where a regression is unambiguous:
# either the file is there with the right bytes, or the agent failed.
id: write-new-file
description: 一句自然语言创建文件
prompt: 在当前目录创建 a.txt，内容写 fooooo
tags: [core, write]
expect:
  files:
    a.txt:
      contains: [fooooo]
  tools:
    must_call: [write_file]
budget:
  max_tool_calls: 6
  max_seconds: 120
---
id: edit-existing-file
description: 就地替换已有文件的内容
prompt: 把 c.txt 里的 old 换成 new
tags: [core, write]
given:
  files:
    c.txt: "keep this\nold\nkeep that\n"
expect:
  files:
    c.txt:
      contains: [new, keep this, keep that]
      absent: [old]
  tools:
    must_call: [edit_file]
budget:
  max_tool_calls: 8
  max_seconds: 120
---
id: read-without-writing
description: 只读问题不该产生写操作
prompt: b.txt 里第二行是什么？直接告诉我，不要改动任何文件。
tags: [core, read, guard]
given:
  files:
    b.txt: "first line\nsecond line\nthird line\n"
expect:
  files:
    b.txt:
      contains: [second line]
  tools:
    must_call: [read_file]
    must_not_call: [write_file, edit_file]
budget:
  max_tool_calls: 5
  max_seconds: 90
---
id: no-tool-needed
description: 纯知识问题不该调工具
prompt: 用一句话解释什么是幂等操作。不要使用任何工具。
tags: [core, chat]
expect:
  tools:
    must_not_call: [read_file, write_file, edit_file, shell]
    max_calls: 0
budget:
  max_tool_calls: 1
  max_seconds: 60
