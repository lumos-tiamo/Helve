name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Several suites call the real localAuthHeaders, which reads this file.
  # Created per job rather than mocked, so the tests exercise the real path.
  HELVE_AUTH_TOKEN: ci-token

jobs:
  engine:
    name: engine (${{ matrix.os }})
    # Both platforms on purpose.  The Seatbelt sandbox only exists on macOS, so
    # Linux alone would silently skip every sandbox test; macOS alone would
    # never catch a Seatbelt test that is missing its platform marker and so
    # fails instead of skipping elsewhere.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
      - name: Seed the local auth token
        run: |
          mkdir -p ~/.helve
          printf '%s' "$HELVE_AUTH_TOKEN" > ~/.helve/auth_token
          chmod 700 ~/.helve && chmod 600 ~/.helve/auth_token
      - name: Run engine tests
        working-directory: engine
        run: uv run --extra test pytest tests -q

  server:
    name: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Seed the local auth token
        run: |
          mkdir -p ~/.helve
          printf '%s' "$HELVE_AUTH_TOKEN" > ~/.helve/auth_token
          chmod 700 ~/.helve && chmod 600 ~/.helve/auth_token
      - name: Run server tests
        working-directory: server
        run: uv run --extra dev pytest tests -q

  evals:
    name: eval harness
    # The scenario cases need a provider and cost money, so CI runs the
    # harness's own suite instead: it proves the measurement equipment works,
    # which is the part that can be checked for free.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: evals/pyproject.toml
      - name: Run harness tests
        working-directory: evals
        run: uv run --extra test pytest tests -q
      - name: The shipped suite must load
        working-directory: evals
        run: uv run helve-eval --list

  shell:
    name: shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shell/package-lock.json
      - name: Install
        working-directory: shell
        run: npm ci
      - name: Seed the local auth token
        run: |
          mkdir -p ~/.helve
          printf '%s' "$HELVE_AUTH_TOKEN" > ~/.helve/auth_token
          chmod 700 ~/.helve && chmod 600 ~/.helve/auth_token
      - name: Typecheck, lint and test
        working-directory: shell
        run: |
          npm run check
          npm test

  image:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: helve-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A build that succeeds but cannot serve is not a working image: this
      # boots it with no LLM configured and asks for the OpenAPI document,
      # which exercises app startup, engine import and the agents/ content
      # tree without needing a provider key.
      - name: Boot it and hit the API
        run: |
          docker run -d --name helve-ci -p 8000:8000 helve-server:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/openapi.json -o /dev/null; then
              echo "server answered after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server never answered"; docker logs helve-ci; exit 1
      - name: Container logs
        if: always()
        run: docker logs helve-ci || true
